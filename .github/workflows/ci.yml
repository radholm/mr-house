name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PortAudio dev headers so sounddevice/PortAudio can build/load on Linux.
      # (macOS & Windows ship PortAudio inside the sounddevice wheel.)
      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 portaudio19-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile all sources
        run: python -m compileall -q run.py src scripts

      # Imports every module + loads config WITHOUT downloading the ~460MB
      # Whisper model, so it's fast and validates cross-platform import health.
      - name: Smoke test (imports + config, headless)
        env:
          # Dummy SDL drivers so pygame can import without a display/audio device.
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python scripts/ci_smoke.py

      - name: CLI help (argparse smoke)
        run: python run.py --help


